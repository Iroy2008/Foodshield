<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodShield - Produce Health & Disease Guard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .loader-ring {
      border: 4px solid rgba(16, 185, 129, 0.1);
      border-left-color: #10b981;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-emerald-500/20 p-2.5 rounded-xl border border-emerald-500/30 text-emerald-400">
          <i class="fa-solid font-bold fa-shield-halved text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
            FoodShield
            <span class="text-xs bg-emerald-500/20 text-emerald-400 font-semibold px-2 py-0.5 rounded-full border border-emerald-500/30">AI Health Guard</span>
          </h1>
          <p class="text-xs text-slate-400">Produce Disease & Safety Analyzer</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Vision Engine Active
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">
    
    <!-- Upload / Camera Section -->
    <section class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6 shadow-xl backdrop-blur-sm">
      <h2 class="text-lg font-semibold text-white mb-2 flex items-center gap-2">
        <i class="fa-solid fa-camera text-emerald-400"></i> Scan Fruit or Vegetable
      </h2>
      <p class="text-sm text-slate-400 mb-6">Upload a photo or take a picture of fresh or diseased produce to run instant visual health diagnostic.</p>

      <!-- Dropzone / Image Preview wrapper -->
      <div class="relative">
        <!-- Hidden real file input -->
        <input type="file" id="fileInput" accept="image/*" class="hidden">

        <!-- Clickable Dropzone Container -->
        <div id="dropzone" class="border-2 border-dashed border-slate-600 hover:border-emerald-500 transition-colors rounded-xl p-6 text-center cursor-pointer bg-slate-900/50 min-h-[220px] flex flex-col items-center justify-center group overflow-hidden">
          
          <!-- Preview Container -->
          <div id="previewContainer" class="hidden w-full flex flex-col items-center">
            <div class="relative max-h-72 rounded-lg overflow-hidden border border-slate-700 shadow-md">
              <img id="imagePreview" src="" alt="Produce preview" class="max-h-72 object-contain rounded-lg">
              <button id="clearBtn" type="button" class="absolute top-2 right-2 bg-slate-900/80 hover:bg-red-600 text-white p-2 rounded-full text-xs transition-colors backdrop-blur z-20">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>

          <!-- Initial Placeholder -->
          <div id="placeholderUI" class="space-y-3 pointer-events-none">
            <div class="w-16 h-16 bg-slate-800 text-slate-400 rounded-2xl flex items-center justify-center mx-auto group-hover:scale-105 group-hover:bg-emerald-500/10 group-hover:text-emerald-400 transition-all border border-slate-700">
              <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
            </div>
            <div>
              <p class="text-sm font-medium text-slate-200">Click or drag & drop produce photo here</p>
              <p class="text-xs text-slate-400 mt-1">Supports JPG, PNG, WEBP</p>
            </div>
          </div>

        </div>
      </div>

      <!-- Action Controls -->
      <div class="mt-4 flex flex-wrap gap-3">
        <button id="uploadBtn" type="button" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-3 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition-all shadow-lg shadow-emerald-600/20 cursor-pointer
