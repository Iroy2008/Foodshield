<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodShield - Produce Health Guard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6 flex flex-col items-center justify-center">

  <div class="max-w-md w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 text-center space-y-4">
    <h1 class="text-2xl font-bold text-emerald-400">FoodShield</h1>
    <p class="text-sm text-slate-400">Upload a picture of a fruit or vegetable to check its health.</p>

    <!-- Standard Visible File Input -->
    <div class="space-y-3">
      <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-slate-400
        file:mr-4 file:py-2.5 file:px-4
        file:rounded-xl file:border-0
        file:text-sm file:font-semibold
        file:bg-emerald-600 file:text-white
        hover:file:bg-emerald-500 cursor-pointer bg-slate-900 p-3 rounded-xl border border-slate-700">
    </div>

    <!-- Image Preview -->
    <div id="previewBox" class="hidden mt-4">
      <img id="myImage" src="" class="max-h-60 mx-auto rounded-lg border border-slate-700 object-contain">
    </div>

    <!-- Result Box -->
    <div id="resultBox" class="hidden mt-4 p-4 bg-slate-900 rounded-xl border border-slate-700 text-left space-y-2">
      <h2 id="resTitle" class="font-bold text-lg text-emerald-400">--</h2>
      <p id="resDesc" class="text-sm text-slate-300">--</p>
    </div>
  </div>

  <script>
    const input = document.getElementById('imageInput');
    const previewBox = document.getElementById('previewBox');
    const myImage = document.getElementById('myImage');
    const resultBox = document.getElementById('resultBox');
    const resTitle = document.getElementById('resTitle');
    const resDesc = document.getElementById('resDesc');

    input.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          myImage.src = e.target.result;
          previewBox.classList.remove('hidden');

          // Simulate simple check based on name or default
          const name = file.name.toLowerCase();
          resultBox.classList.remove('hidden');

          if (name.includes('banana') || name.includes('spot')) {
            resTitle.textContent = "Banana: Anthracnose / Fungal Spots";
            resDesc.textContent = "Safety: CONSUME WITH CAUTION. Peel and check the flesh underneath. Minor spots can be trimmed if the inside is firm.";
          } else if (name.includes('berry') || name.includes('strawberry') || name.includes('mold')) {
            resTitle.textContent = "Strawberry: Gray Mold (Botrytis)";
            resDesc.textContent = "Safety: UNSAFE TO EAT. Mold has likely penetrated the soft tissue. Discard immediately.";
          } else {
            resTitle.textContent = "Fresh Produce Specimen";
            resDesc.textContent = "Safety: SAFE TO EAT. No major pathological defects or mold detected. Wash thoroughly before consumption.";
          }
        }
        reader.readAsDataURL(file);
      }
    });
  </script>

</body>
</html>
